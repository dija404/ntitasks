<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Doctor Appointment Form</title>
</head>
<body>

    <h1>Doctor Appointment Form</h1>
    <hr>

    <form action="" >
        
        <label for="date">Appointment Date</label>
        <input type="date" id="date" name="appointment_date">
        <br><br>

        <label for="time">Appointment Time</label>
        <input type="time" id="time" name="appointment_time">
        <br><br>

        <label>Name</label>
        <input type="text" name="first_name" placeholder="First">
        <input type="text" name="last_name" placeholder="Last">
        <br><br>

        <label>Gender</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <br><br>

        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="####">
        <br><br>

        <label>Address</label>
        <input type="text" name="city" placeholder="city">
        <input type="text" name="state" placeholder="state">
        <br><br>

        <label for="query">Your Query</label>
        <textarea id="query" name="query" rows="4" cols="50"></textarea>
        <br><br>

        <label>Appointment Type</label>
        <span>Select which appointment type(s) you require</span>
        <br>
        <input type="checkbox" id="cervix" name="appointment_type[]" value="Cervix checkup" >
        <label for="cervix">Cervix checkup</label><br>
        
        <input type="checkbox" id="heart" name="appointment_type[]" value="Heart checkup" >
        <label for="heart">Heart checkup</label><br>
        
        <input type="checkbox" id="eye" name="appointment_type[]" value="Eye check-up">
        <label for="eye">Eye check-up</label><br>
        
        <input type="checkbox" id="hearing" name="appointment_type[]" value="Hearing Test">
        <label for="hearing">Hearing Test</label>
        <br><br>

        <button type="submit">Send</button>

    </form>

</body>
</html>
